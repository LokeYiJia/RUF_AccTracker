// ─── ADMIN: ORDERS DASHBOARD ──────────────────────────
function orderStatusBadge(o) {
  const map = {
    'awaiting-payment': ['b-await','Awaiting Payment'],
    'pending': ['b-pending','Payment Claimed'],
    'fulfilled': ['b-fulfilled','Fulfilled'],
    'cancelled': ['b-cancelled','Cancelled']
  };
  const [cls,lbl] = map[o.status]||['b-cancelled',o.status||'?'];
  return el('span',{class:'badge '+cls},lbl);
}

function pageOrders() {
  const pg = div({});
  pg.appendChild(hdr('Merch Orders', null, ()=>go('home')));
  const body = div({class:'page'});

  const boothQ = S.orders.filter(o=>o.status==='awaiting-payment').length;
  const onlineQ = S.orders.filter(o=>o.status==='pending').length;
  const done = S.orders.filter(o=>o.status==='fulfilled').length;
  const sb = div({class:'stat-box'});
  [[boothQ,'Booth Queue',boothQ?'amber':''],[onlineQ,'Online Pending',onlineQ?'amber':''],[done,'Fulfilled','']].forEach(([n,lbl,cls])=>{
    const s = div({class:'stat'});
    s.appendChild(el('div',{class:'stat-n '+cls},String(n)));
    s.appendChild(el('div',{class:'stat-label'},lbl));
    sb.appendChild(s);
  });
  body.appendChild(sb);

  const pills = div({class:'pills'});
  ['Needs Action','Booth','Online','Fulfilled','Cancelled','All'].forEach(f=>{
    pills.appendChild(el('span',{class:'pill'+(S.orderFilter===f?' active':''),onclick:()=>{S.orderFilter=f;render();}},f));
  });
  body.appendChild(pills);

  let list = S.orders;
  if (S.orderFilter==='Needs Action') list = list.filter(o=>ACTIVE_ORDER_STATUSES.includes(o.status));
  else if (S.orderFilter==='Booth') list = list.filter(o=>o.type==='booth');
  else if (S.orderFilter==='Online') list = list.filter(o=>o.type==='online');
  else if (S.orderFilter==='Fulfilled') list = list.filter(o=>o.status==='fulfilled');
  else if (S.orderFilter==='Cancelled') list = list.filter(o=>o.status==='cancelled');

  if (!list.length) body.appendChild(el('p',{style:{color:'var(--gray)',textAlign:'center',padding:'30px 0'}},'No orders here.'));

  list.forEach(o => {
    const card = div({class:'order-card'});
    const top = div({class:'order-top'});
    top.appendChild(el('span',{class:'order-id'},o.orderId));
    top.appendChild(el('span',{class:'badge '+(o.type==='booth'?'b-booth':'b-online')},o.type==='booth'?'Booth':'Online'));
    top.appendChild(orderStatusBadge(o));
    card.appendChild(top);
    card.appendChild(div({class:'order-meta'},fmtDateTime(o.createdAt)));
    const c = o.customer||{};
    card.appendChild(div({class:'order-meta'},`${c.name||'?'} · ${c.phone||'—'}${c.email?' · '+c.email:''}`));

    const box = div({class:'order-lines'});
    (o.items||[]).forEach(li=>{
      const r = div({class:'order-line'});
      r.appendChild(el('span',{},`${li.qty} × ${li.name}`));
      r.appendChild(el('span',{},fmtRM((li.unitPrice||0)*(li.qty||0))));
      box.appendChild(r);
    });
    const totR = div({class:'order-total'});
    totR.appendChild(el('span',{},'Total'));
    totR.appendChild(el('span',{},fmtRM(o.total)));
    box.appendChild(totR);
    card.appendChild(box);

    // Photos: receipt (online) + fulfilment
    const thumbs = div({style:{display:'flex',gap:'10px',flexWrap:'wrap'}});
    const mkThumb = (url,label)=>{
      const w = div({style:{textAlign:'center'}});
      const im = el('img',{src:url,loading:'lazy',style:{width:'80px',height:'80px',objectFit:'cover',borderRadius:'8px',border:'1px solid var(--border)',cursor:'pointer'}});
      im.onclick = ()=>{S.enlargedOrderPhoto=url;render();};
      w.appendChild(im);
      w.appendChild(el('div',{style:{fontSize:'11px',color:'var(--gray)',marginTop:'3px'}},label));
      return w;
    };
    if (o.receiptUrl) thumbs.appendChild(mkThumb(o.receiptUrl,'Receipt'));
    if (o.fulfilPhotoUrl) thumbs.appendChild(mkThumb(o.fulfilPhotoUrl,'Fulfilment'));
    if (thumbs.childNodes.length) card.appendChild(thumbs);
    if (o.type==='online' && !o.receiptUrl && ACTIVE_ORDER_STATUSES.includes(o.status))
      card.appendChild(div({class:'alert al-amber',style:{marginTop:'10px',marginBottom:'0'}},'⚠ No receipt attached — verify payment before fulfilling.'));

    if (o.status==='fulfilled') card.appendChild(div({class:'order-meta',style:{marginTop:'8px'}},'Fulfilled: '+fmtDateTime(o.fulfilledAt)));
    if (o.status==='cancelled') card.appendChild(div({class:'order-meta',style:{marginTop:'8px'}},'Cancelled: '+fmtDateTime(o.cancelledAt)+(o.cancelReason?' — '+o.cancelReason:'')));

    // Actions
    if (ACTIVE_ORDER_STATUSES.includes(o.status)) {
      const acts = div({class:'order-actions'});
      if (S.confirmCancelId===o.orderId) {
        const cbox = div({class:'alert al-red',style:{width:'100%',marginBottom:'0'}});
        cbox.appendChild(el('p',{style:{fontWeight:'bold',marginBottom:'10px'}},'Cancel this order? Reserved stock will be released.'));
        const rr = div({style:{display:'flex',gap:'10px'}});
        rr.appendChild(el('button',{class:'btn btn-red btn-sm',onclick:async()=>{
          try{ await cancelOrder(o.orderId,'Cancelled by admin'); toast('Order cancelled.'); }catch(e){console.error(e);toast('Error cancelling.');}
          S.confirmCancelId=null;
        }},'Yes, cancel order'));
        rr.appendChild(el('button',{class:'btn btn-outline btn-sm',onclick:()=>{S.confirmCancelId=null;render();}},'Keep order'));
        cbox.appendChild(rr);
        acts.appendChild(cbox);
      } else {
        if (o.status==='awaiting-payment') {
          acts.appendChild(el('button',{class:'btn btn-green btn-sm',style:{fontSize:'15px',padding:'12px 22px'},onclick:()=>doConfirmBoothPayment(o.orderId)},'✓ Payment Received'));
        } else {
          acts.appendChild(el('button',{class:'btn btn-navy btn-sm',style:{fontSize:'15px',padding:'12px 22px'},onclick:()=>{
            S.fulfilOrderId=o.orderId; S.fulfilThumb=null; go('fulfil');
          }},'Fulfil Order 📷'));
        }
        acts.appendChild(el('button',{class:'btn btn-red btn-sm',onclick:()=>{S.confirmCancelId=o.orderId;render();}},'Cancel'));
      }
      card.appendChild(acts);
    }
    body.appendChild(card);
  });

  // Enlarged photo overlay
  if (S.enlargedOrderPhoto) {
    const ov = div({class:'modal-overlay',style:{cursor:'zoom-out'},onclick:()=>{S.enlargedOrderPhoto=null;render();}});
    const im = el('img',{src:S.enlargedOrderPhoto,style:{maxWidth:'90vw',maxHeight:'85vh',borderRadius:'10px'}});
    im.onclick = e=>e.stopPropagation();
    ov.appendChild(im);
    pg.appendChild(ov);
  }

  pg.appendChild(body); return pg;
}

  cam.onchange = async e => { const f=e.target.files[0]; if(!f) return; cam.value=''; S.fulfilThumb=await resizeImg(f); render(); };

  if (S.loading) body.appendChild(div({class:'loading-pg'},div({class:'spinner'}),el('p',{},'Fulfilling...')));
  else body.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>doFulfil()},'Confirm Fulfilment — Deduct Stock'));

  pg.appendChild(body); return pg;
}

async function doFulfil() {
  if (!S.fulfilThumb) { toast('Photo required before fulfilling.'); return; }
  S.loading = true; render();
  try {
    let photoUrl = null;
    try { photoUrl = await uploadOrderPhoto(S.fulfilThumb, `fulfilments/${S.fulfilOrderId}.jpg`); }
    catch(e) { console.warn('fulfil photo upload failed', e); }
    await fulfilOrderTx(S.fulfilOrderId, { fulfilPhotoUrl: photoUrl, fulfilChannel:'online' });
    S.items = await loadItems();
    S.fulfilThumb = null; S.fulfilOrderId = null;
    toast('Order fulfilled — stock deducted.');
    S.page = 'orders';
  } catch(e) { console.error(e); toast(e.message||'Error fulfilling.'); }
  S.loading = false; render();
}

// ─── BOX MANAGE (admin — pick which items live in this box) ───
function pageBoxManage() {
  const boxItem = S.currentItem;
  if (!boxItem || !isBox(boxItem)) { go('home'); return div({}); }
  if (!S.boxManageSel) S.boxManageSel = new Set(boxContents(boxItem.id).map(i=>i.id));

  const pg = div({});
  pg.appendChild(hdr('Manage '+boxItem.id, null, ()=>{S.boxManageSel=null;go('detail');}));
  const body = div({class:'page page-narrow'});
  body.appendChild(el('p',{class:'sub',style:{marginTop:'0'}},
    `Tick the items that live inside ${boxItem.name||boxItem.id}. Only non-consumable items can go in a box.`));

  const countEl = el('span',{style:{fontWeight:'800',color:'var(--navy)'}},String(S.boxManageSel.size));
  const countLine = el('p',{style:{fontSize:'13px',color:'var(--gray)',marginBottom:'12px'}});
  countLine.appendChild(countEl);
  countLine.appendChild(document.createTextNode(' item(s) selected'));
  body.appendChild(countLine);

  const si = el('input',{type:'text',placeholder:'Search items...',style:{width:'100%',padding:'10px 14px',border:'1.5px solid var(--border)',borderRadius:'8px',fontFamily:'inherit',fontSize:'15px',marginBottom:'14px',outline:'none'}});
  si.value = S.boxManageSearch;
  body.appendChild(si);

  const listWrap = div({});
  body.appendChild(listWrap);

  const rebuild = () => {
    listWrap.innerHTML='';
    const q = (S.boxManageSearch||'').toLowerCase();
    const eligible = boxableItems().filter(i => i.id!==boxItem.id &&
      (!q || [i.name,i.id,i.storageLocation].some(v=>v?.toLowerCase().includes(q))));
    if (!eligible.length) { listWrap.appendChild(el('p',{style:{color:'var(--gray)',fontSize:'14px',padding:'16px 0'}},'No matching items.')); return; }
    eligible.forEach(i => {
      const inOtherBox = i.boxId && i.boxId!==boxItem.id;
      const row = div({class:'cart-line',style:{cursor:'pointer'}});
      const chk = el('input',{type:'checkbox',style:{width:'20px',height:'20px',flexShrink:'0',cursor:'pointer',accentColor:'var(--navy)'}});
      chk.checked = S.boxManageSel.has(i.id);
      const toggle = () => {
        if (S.boxManageSel.has(i.id)) S.boxManageSel.delete(i.id); else S.boxManageSel.add(i.id);
        chk.checked = S.boxManageSel.has(i.id);
        countEl.textContent = String(S.boxManageSel.size);
      };
      chk.onclick = e => { e.stopPropagation(); toggle(); chk.checked=S.boxManageSel.has(i.id); };
      row.onclick = toggle;
      row.appendChild(chk);
      if (i.photoUrl) row.appendChild(el('img',{src:i.photoUrl,alt:i.name,loading:'lazy'}));
      const info = div({class:'cart-line-info'});
      info.appendChild(div({class:'cart-line-name'},i.name||'—'));
      const notes = [i.id];
      if (inOtherBox) notes.push('currently in '+i.boxId);
      if (i.status==='Borrowed') notes.push('borrowed by '+(i.borrowedBy||'?'));
      info.appendChild(div({class:'cart-line-price'},notes.join(' · ')));
      row.appendChild(info);
      listWrap.appendChild(row);
    });
  };
  si.oninput = e => { S.boxManageSearch=e.target.value; rebuild(); };
  rebuild();

  if (S.loading) body.appendChild(div({class:'loading-pg'},div({class:'spinner'})));
  else {
    const saveB = el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%',marginTop:'16px'},onclick:()=>doBoxManageSave()},'Save Contents');
    body.appendChild(saveB);
  }

  pg.appendChild(body); return pg;
}

async function doBoxManageSave() {
  const boxItem = S.currentItem;
  S.loading = true; render();
  try {
    const orig = new Set(boxContents(boxItem.id).map(i=>i.id));
    // Adding to box: box becomes the location. Releasing: item inherits the box's current location.
    for (const id of S.boxManageSel) if (!orig.has(id)) await writeItem(id,{boxId:boxItem.id,storageLocation:''});
    for (const id of orig) if (!S.boxManageSel.has(id)) await writeItem(id,{boxId:null,storageLocation:boxItem.storageLocation||''});
    S.items = await loadItems();
    S.currentItem = await loadItem(boxItem.id);
    S.boxManageSel = null;
    toast('Box contents updated.');
    S.page = 'detail';
  } catch(e) { console.error(e); toast('Error saving contents.'); }
  S.loading = false; render();
}

// PIN
function pagePin() {
  const pg = div({style:{minHeight:'100vh',position:'relative'}});

  // Home icon top-right
  const homeBtn = el('button', {
    onclick: ()=>{S.pendingFn=null;S.pinInput='';goWelcome();},
    style:{position:'absolute',top:'24px',right:'28px',background:'none',border:'none',
      fontSize:'22px',cursor:'pointer',color:'var(--gray)',lineHeight:'1',padding:'4px',
      borderRadius:'6px',transition:'color .15s'}
  }, '⌂');
  homeBtn.onmouseenter = () => homeBtn.style.color = 'var(--navy)';
  homeBtn.onmouseleave = () => homeBtn.style.color = 'var(--gray)';
  pg.appendChild(homeBtn);

  // Centered content
  const wrap = div({style:{
    minHeight:'100vh',display:'flex',flexDirection:'column',
    alignItems:'center',justifyContent:'center',padding:'40px 20px'
  }});

  wrap.appendChild(el('p',{style:{fontSize:'17px',color:'var(--gray)',marginBottom:'36px',fontWeight:'500',textAlign:'center'}},
    'Enter your 4-digit admin PIN'));

  const pinWrap = div({style:{width:'100%',maxWidth:'340px'}});

  const pinInp = el('input',{type:'password',inputmode:'numeric',maxlength:'4',placeholder:'••••',
    style:{fontSize:'36px',letterSpacing:'16px',textAlign:'center',width:'100%',padding:'18px',
      border:'2px solid var(--border)',borderRadius:'12px',fontFamily:'inherit',outline:'none',
      marginBottom:'14px',transition:'border-color .2s',boxSizing:'border-box'}});
  pinInp.value = S.pinInput;
  pinInp.oninput = e => S.pinInput = e.target.value;
  pinInp.onkeydown = e => { if(e.key==='Enter') doPin(); };
  pinInp.onfocus = () => pinInp.style.borderColor = 'var(--navy)';
  pinInp.onblur = () => pinInp.style.borderColor = 'var(--border)';

  const errEl = el('p',{id:'pin-err',style:{color:'red',fontSize:'13px',marginBottom:'12px',textAlign:'center',display:'none'}},'Incorrect PIN.');

  // Unlock button styled like welcome cards
  const unlockBtn = el('button', {
    style:{width:'100%',padding:'18px',border:'2px solid var(--navy)',borderRadius:'12px',
      background:'var(--navy)',color:'#fff',fontFamily:'inherit',fontSize:'16px',fontWeight:'700',
      cursor:'pointer',transition:'all .2s ease',letterSpacing:'.3px'},
    onclick: ()=>doPin()
  }, 'Unlock');
  unlockBtn.onmouseenter = ()=>{ unlockBtn.style.transform='translateY(-3px)'; unlockBtn.style.boxShadow='0 8px 24px rgba(33,54,89,.2)'; };
  unlockBtn.onmouseleave = ()=>{ unlockBtn.style.transform=''; unlockBtn.style.boxShadow=''; };

  pinWrap.appendChild(pinInp);
  pinWrap.appendChild(errEl);
  if (S.loading) pinWrap.appendChild(div({class:'loading-pg'},div({class:'spinner'})));
  else pinWrap.appendChild(unlockBtn);

  wrap.appendChild(pinWrap);
  

  pg.appendChild(wrap);
  return pg;
}

async function doPin() {
  const pin=S.pinInput.trim();
  if(pin.length<4){const e=document.getElementById('pin-err');if(e)e.style.display='block';return;}
  S.loading=true; render();
  const ok=await verifyPin(pin);
  S.loading=false;
  if(ok){
    S.isAdmin=true; S.pinInput='';
    localStorage.setItem(LS_SESS,String(Date.now()+3600000));
    const fn=S.pendingFn; S.pendingFn=null;
    if(fn){fn();}else{goWelcome();}
  } else {
    render();
    setTimeout(()=>{const e=document.getElementById('pin-err');if(e)e.style.display='block';},30);
  }
}

// QR SHEET
function pageQR() {
  const pg=div({});
  const h=div({class:'hdr no-print'});
  h.appendChild(el('span',{class:'hdr-back',onclick:()=>{go('settings');}},'←'));
  h.appendChild(el('span',{class:'hdr-title'},'QR Sticker Sheet'));
  h.appendChild(el('span',{class:'hdr-action',onclick:()=>window.print()},'Print'));
  pg.appendChild(h);

  if(!S.items.length){
    pg.appendChild(div({class:'page'},el('p',{style:{color:'var(--gray)',textAlign:'center',padding:'30px'}},'No items yet.')));
    return pg;
  }

  const appUrl=window.location.origin+window.location.pathname;
  const grid=div({class:'qr-grid'});
  S.items.forEach(item=>{
    const card=div({class:'qr-card'});
    const qrEl=div({style:{display:'flex',justifyContent:'center'}});
    card.appendChild(qrEl);
    card.appendChild(el('div',{class:'qr-id'},item.id));
    card.appendChild(el('div',{class:'qr-name'},item.name||'—'));
    grid.appendChild(card);
    setTimeout(()=>{
      try{new QRCode(qrEl,{text:`${appUrl}?item=${item.id}`,width:100,height:100,colorDark:'#000',colorLight:'#fff'});}
      catch(e){qrEl.textContent=item.id;}
    },80);
  });

  pg.appendChild(grid); return pg;
}

  cards.appendChild(makeCard('Take an Item', ()=>{S.borrowerMode=true;S.takeMode=true;S.viewMode='bento';S.filter='All';S.statusFilter='All';S.borrowFilter='All';S.search='';go('list');}));
  cards.appendChild(makeCard('Log an Item', ()=>checkAdmin(()=>{

// ─── RENDER ───────────────────────────────────────────
function render() {
  const app=document.getElementById('app');
  const pages={
    'welcome':pageWelcome,
    'setup':pageSetup,'loading':pageLoading,'home':pageHome,'list':pageList,
    'detail':pageDetail,'add':pageAdd,'borrow':pageBorrow,'borrow-ok':pageBorrowOk,
    'return':pageReturn,'return-ok':pageReturnOk,'edit':pageEdit,
    'take':pageTake,'take-ok':pageTakeOk,
    'pin':pagePin,'settings':pageSettings,'qr':pageQR,
    'shop':pageShop,'cart':pageCart,'pay':pagePay,'order-ok':pageOrderOk,
    'orders':pageOrders,'fulfil':pageFulfil,'box-manage':pageBoxManage
  };
  const fn=pages[S.page]||pageHome;
  app.innerHTML=''; app.appendChild(fn());
  const gOv=galleryOverlay(); if (gOv) app.appendChild(gOv);
  window.scrollTo(0,0);
  if(S.page==='list') updateList();
  if(S.page==='detail' && S.currentLogs && S.currentLogs.length) renderLogs();
}

// ─── BOOT ─────────────────────────────────────────────
async function loadAndStart() {
  render(); // show loading
  try { S.items=await loadItems(); } catch(e){ S.items=[]; }

  // One-time soft migrations:
  // 1) legacy 'Box / Storage'-categorised items → explicit isBox flag + 'Box' category
  // 2) legacy 'Booth Kit'-categorised boxes → 'Box' category
  try {
    for (const i of S.items) {
      if (i.isBox===undefined && isBoxCat(i.category)) {
        await writeItem(i.id,{isBox:true,category:'Box'});
        i.isBox=true; i.category='Box';
      } else if (i.isBox===true && (i.category||'').trim().toLowerCase()==='booth kit') {
        await writeItem(i.id,{category:'Box'});
        i.category='Box';
      }
    }
  } catch(e){ console.warn('box migration',e); }
  const sess=localStorage.getItem(LS_SESS);
  S.isAdmin=!!(sess&&parseInt(sess)>Date.now());

  // Live orders feed (stock reservations + staff queue)
  subscribeOrders();

  // Handle QR scan / direct-mode links via URL params
  const params=new URLSearchParams(window.location.search);
  const qrId=params.get('item');
  const mode=(params.get('mode')||'').toLowerCase();
  if(qrId){
    S.qrItemId=qrId;
    try{
      S.currentItem=await loadItem(qrId);
      S.currentLogs=[];
      S.page=S.currentItem?'detail':'home';
      if(!S.currentItem) toast('Item not found: '+qrId);
    }catch(e){S.page='home';}
  } else if(mode==='shop'){
    S.shopMode='online'; S.kiosk=false; S.cart={}; S.page='shop';
  } else if(mode==='booth'){
    S.shopMode='booth'; S.kiosk=true; S.cart={}; S.page='shop';
  } else {
    S.page='welcome';
  }
  render();

  // Load logs async if on detail page
  if(S.page==='detail'&&S.currentItem){
    S.currentLogs=S.currentItem.isConsumable?await loadConsumableLogs(S.currentItem.id):await loadLogs(S.currentItem.id);
    renderLogs();
  }
}

async function boot() {
  // Use saved config override if admin reconfigured, else use baked-in
  const savedCfg = localStorage.getItem(LS_FB);
  const cfg = savedCfg ? JSON.parse(savedCfg) : BAKED_FB;
  if (!fbInit(cfg)) { S.page='setup'; render(); return; }
  S.page='loading'; render();
  await loadAndStart();
}

boot();
</script>
