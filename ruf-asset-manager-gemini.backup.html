<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RUF Asset Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Montserrat',sans-serif;background:#fff;color:#000;min-height:100vh}
#app{max-width:1100px;margin:0 auto;min-height:100vh;padding:0 20px}
:root{
  --navy:#213659;--navy-lt:#2d4a7a;
  --green:#166534;--amber:#92400E;--red:#991B1B;
  --gray:#6B7280;--light:#F5F5F5;--border:#E5E7EB;
}

/* Layout */
.hdr{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;border-radius:0 0 8px 8px}
.hdr-title{font-size:17px;font-weight:700;flex:1}
.hdr-back{cursor:pointer;font-size:22px;line-height:1;padding-right:4px}
.hdr-action{cursor:pointer;font-size:14px;font-weight:600;opacity:.9;padding-left:8px}
.page{padding:28px 28px 60px}

/* Stats */
.stat-box{background:var(--light);border-radius:10px;padding:20px 30px;margin-bottom:20px;display:flex;gap:20px}
.stat{flex:1;text-align:center}
.stat-n{font-size:26px;font-weight:700;color:var(--navy)}
.stat-n.amber{color:var(--amber)}
.stat-n.red{color:var(--red)}
.stat-label{font-size:11px;color:var(--gray);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

/* Buttons */
.btn{display:block;width:100%;padding:14px 20px;border-radius:8px;border:none;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;text-align:center;margin-bottom:10px;transition:opacity .15s;max-width:600px}
.btn:active{opacity:.75}
.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:#fff;color:#000;border:1.5px solid #ccc}
.btn-outline-navy{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn-green{background:#166534;color:#fff}
.btn-red{color:var(--red);border:1.5px solid var(--red);background:#fff}
.btn-sm{padding:8px 14px;font-size:14px;width:auto;display:inline-block;margin-bottom:0}
.btn-row{display:flex;gap:10px;margin-bottom:10px}
.btn-row .btn{margin-bottom:0}

/* Cards */
.card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;cursor:pointer}
.card:active{background:var(--light)}
.card-photo{width:100%;height:220px;object-fit:cover;border-radius:6px;display:block;margin-bottom:10px;background:var(--light)}
.card-id{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.5px;margin-bottom:3px}
.card-name{font-size:16px;font-weight:700;margin-bottom:5px}
.card-meta{font-size:13px;color:var(--gray);display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-avail{background:#DCFCE7;color:#166534}
.b-borrow{background:#FEF3C7;color:#92400E}
.b-missing{background:#FEE2E2;color:#991B1B}
.b-overdue{background:#FEE2E2;color:#991B1B}

/* Filter pills */
.pills{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#fff;white-space:nowrap;flex-shrink:0}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Form */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:15px;background:#fff;color:#000;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy)}
.field textarea{min-height:72px;resize:vertical}

/* Location grid */
.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.loc-btn{padding:12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .1s}
.loc-btn.sel{border-color:var(--navy);background:var(--navy);color:#fff}

/* Misc */
.divider{height:1px;background:var(--border);margin:20px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--navy);text-transform:uppercase;margin-bottom:4px}
.section-title{font-size:16px;font-weight:700;margin-bottom:10px}
.sub{color:var(--gray);font-size:14px;margin-top:4px;margin-bottom:16px}

/* Alert boxes */
.alert{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.5}
.al-green{background:#DCFCE7;color:#166534}
.al-amber{background:#FEF3C7;color:#92400E}
.al-red{background:#FEE2E2;color:#991B1B}
.al-navy{background:#EFF4FB;color:var(--navy)}

/* Photo */
.photo-preview{width:100%;max-height:220px;object-fit:cover;border-radius:8px;display:block;margin-bottom:12px}
.photo-drop{width:100%;height:150px;background:var(--light);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px dashed var(--border);margin-bottom:12px}
.photo-drop-icon{font-size:36px}
.photo-drop-label{font-size:14px;color:var(--gray);margin-top:6px}
.photo-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.photo-tile{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:3px solid transparent;cursor:pointer;flex-shrink:0}
.photo-tile img{width:100%;height:100%;object-fit:cover;display:block}
.photo-tile.cover{border-color:var(--navy)}
.photo-tile-star{position:absolute;bottom:2px;left:2px;right:2px;background:var(--navy);color:#fff;font-size:9px;font-weight:700;padding:2px 0;border-radius:4px;text-align:center}
.photo-tile-x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border:none;line-height:1;padding:0}
.photo-tile-add{width:84px;height:84px;border-radius:8px;background:var(--light);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gray);cursor:pointer;flex-shrink:0}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gallery-dot{width:9px;height:9px;border-radius:50%;cursor:pointer;display:inline-block}
.gallery-count-badge{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;pointer-events:none}
.detail-photo{width:100%;max-height:260px;object-fit:cover;display:block}
.detail-photo-ph{width:100%;height:160px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:52px}

/* Log entries */
.log-item{padding:12px 0;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-borrower{font-weight:700;font-size:15px}
.log-meta{font-size:13px;color:var(--gray);margin-top:2px}
.log-dot{font-size:12px;font-weight:700;margin-top:4px}

/* Loading */
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-pg{text-align:center;padding:50px 20px}
.loading-pg p{color:var(--gray);font-size:14px;margin-top:10px}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* Setup */
.setup-wrap{padding:32px 20px;max-width:480px;margin:0 auto}
.setup-icon{width:64px;height:64px;background:var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
.setup-textarea{width:100%;height:160px;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-family:monospace;font-size:12px;resize:vertical;outline:none;line-height:1.6;color:#333}
.setup-textarea:focus{border-color:var(--navy)}

/* QR */
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.qr-card{border:1px solid #ccc;border-radius:8px;padding:12px;text-align:center;break-inside:avoid}
.qr-id{font-size:11px;font-weight:700;color:var(--navy);margin-top:8px;letter-spacing:.5px}
.qr-name{font-size:12px;margin-top:3px;word-break:break-word;color:#333}

/* Success */
.success-wrap{text-align:center;padding:50px 20px}
.success-icon{font-size:64px;margin-bottom:20px}

@media print{
  .no-print{display:none!important}
  .hdr{display:none!important}
  .qr-grid{grid-template-columns:1fr 1fr 1fr}
}

.welcome-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.welcome-title{font-size:40px;font-weight:800;margin-bottom:10px;color:#000;letter-spacing:-1px}
.welcome-sub{font-size:17px;color:var(--gray);margin-bottom:56px;font-weight:500}
.welcome-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;max-width:1000px}
.welcome-card{flex:1 1 180px;min-width:180px;background:#fff;border:2px solid var(--border);border-radius:16px;padding:40px 18px;cursor:pointer;transition:all .2s ease;text-align:center;display:flex;align-items:center;justify-content:center;min-height:120px}
.welcome-card:hover{border-color:var(--navy);background:var(--navy);color:#fff;transform:translateY(-4px);box-shadow:0 10px 30px rgba(33,54,89,.18)}
.welcome-card:hover .wc-label{color:#fff}
.wc-label{font-size:17px;font-weight:700;color:#000;letter-spacing:-.2px}
.bento-grid .card{margin-bottom:0}

/* Consistent button lift animation */
.btn-lift{transition:all .2s ease!important;border:2px solid var(--navy)!important;border-radius:10px!important;padding:14px 20px!important;font-weight:700!important;cursor:pointer;font-family:inherit;font-size:15px}
.btn-lift:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(33,54,89,.18)!important}
.btn-lift-navy{background:#fff;color:#333;border-color:#ccc!important}.btn-lift-navy:hover{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.btn-lift-outline{background:#fff;color:#333;border-color:#ccc!important}.btn-lift-outline:hover{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.btn-side-row{display:flex;gap:14px;margin-bottom:10px}
.btn-side-row .btn-lift{flex:1}

/* Sheet view */
.sheet-table{width:100%;border-collapse:collapse;font-size:14px}
.sheet-table th{padding:10px 14px;text-align:left;border-bottom:2px solid var(--border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);cursor:pointer;user-select:none;white-space:nowrap;background:#fff;position:sticky;top:0}
.sheet-table th:hover{color:var(--navy)}
.sheet-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.sheet-table tr:hover td{background:var(--light);cursor:pointer}
.sheet-wrap{overflow-x:auto;border:1.5px solid var(--border);border-radius:10px;margin-top:4px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-box{background:#fff;border-radius:16px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-icon{font-size:40px;margin-bottom:14px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:10px}
.modal-body{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:24px}
.modal-loc{font-weight:700;color:var(--navy)}
.modal-btns{display:flex;flex-direction:column;gap:10px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s ease}

/* ─── Merch store ─── */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding-bottom:110px}
.shop-card{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.shop-photo{width:100%;height:200px;object-fit:cover;background:var(--light);display:block}
.shop-photo-ph{width:100%;height:200px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:44px}
.shop-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.shop-name{font-size:15px;font-weight:700}
.shop-price{font-size:16px;font-weight:800;color:var(--navy)}
.shop-stock{font-size:12px;color:var(--gray);font-weight:600}
.qty-row{display:flex;align-items:center;gap:10px;margin-top:auto}
.qty-btn{width:38px;height:38px;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:active{background:var(--navy);color:#fff}
.qty-btn:disabled{border-color:var(--border);color:var(--border);cursor:default}
.qty-n{min-width:34px;text-align:center;font-size:17px;font-weight:800}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:50;box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.cart-bar-info{font-size:15px;font-weight:700}
.cart-bar-btn{background:#fff;color:var(--navy);border:none;border-radius:10px;padding:12px 22px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.cart-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-line img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0}
.cart-line-info{flex:1;min-width:0}
.cart-line-name{font-weight:700;font-size:14px}
.cart-line-price{font-size:13px;color:var(--gray)}
.total-row{display:flex;justify-content:space-between;font-size:17px;font-weight:800;padding:16px 0;border-top:2px solid #000;margin-top:6px}
/* Order status badges */
.b-await{background:#EFF4FB;color:#213659}
.b-pending{background:#FEF3C7;color:#92400E}
.b-fulfilled{background:#DCFCE7;color:#166534}
.b-cancelled{background:#F3F4F6;color:#6B7280}
.b-online{background:#EDE9FE;color:#5B21B6}
.b-booth{background:#FFEDD5;color:#9A3412}
/* Order cards (admin) */
.order-card{border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;background:#fff}
.order-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.order-id{font-size:14px;font-weight:800;color:var(--navy);letter-spacing:.5px}
.order-meta{font-size:13px;color:var(--gray);margin-bottom:4px}
.order-lines{margin:10px 0;padding:10px 14px;background:var(--light);border-radius:8px;font-size:14px}
.order-line{display:flex;justify-content:space-between;padding:3px 0}
.order-total{display:flex;justify-content:space-between;font-weight:800;border-top:1.5px solid var(--border);margin-top:6px;padding-top:6px}
.order-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pay-qr-wrap{display:flex;flex-direction:column;align-items:center;padding:20px;border:2px dashed var(--border);border-radius:14px;margin:18px 0}
.pulse-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--amber);margin-right:8px;animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ─── Shared responsive grids ─── */
.bento-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.bento-photo{width:100%;height:220px;object-fit:cover;display:block;background:var(--light)}
.bento-photo-ph{width:100%;height:220px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:48px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.detail-grid.last{margin-bottom:20px}
/* Centered narrow pages (checkout, payment, fulfilment) */
.page-narrow{max-width:600px;margin:0 auto}

/* ─── Phone / small screens ─── */
@media(max-width:699px){
  .welcome-cards{flex-direction:column;gap:12px;max-width:420px;margin:0 auto}
  .welcome-card{padding:22px 18px;min-height:0;width:100%}
  .welcome-title{font-size:32px}
  .welcome-sub{margin-bottom:32px}
  .bento-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .bento-photo,.bento-photo-ph,.card-photo{height:150px}
  .shop-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .shop-photo,.shop-photo-ph{height:150px}
  .shop-info{padding:10px 10px 12px}
  .shop-name{font-size:14px}
}
@media(max-width:560px){
  #app{padding:0 10px}
  .page{padding:20px 12px 60px}
  .hdr{padding:12px 14px}
  .hdr-title{font-size:15px}
  .detail-body{padding:18px 12px!important}
  .detail-grid{grid-template-columns:1fr 1fr}
  .stat-box{flex-wrap:wrap;gap:12px;padding:16px 18px}
  .stat{flex:1 1 40%;min-width:0}
  .stat-n{font-size:22px}
  .btn-side-row{flex-direction:column}
  .btn-row{flex-wrap:wrap}
  .cart-line{flex-wrap:wrap;row-gap:8px}
  .cart-line-total{min-width:0!important;margin-left:auto}
  .cart-bar{padding:12px 14px}
  .cart-bar-info{font-size:14px}
  .cart-bar-btn{padding:11px 16px;font-size:14px}
  .qty-btn{width:34px;height:34px;font-size:18px}
  .qty-n{min-width:28px;font-size:15px}
  .order-card{padding:14px 12px}
  .order-actions .btn{flex:1 1 auto}
  .qr-grid{grid-template-columns:1fr 1fr;gap:10px;padding:10px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="cam-input" style="display:none">
<input type="file" accept="image/*" id="file-input" style="display:none">

// ─── NAVIGATION ───────────────────────────────────────
function go(page) {
  S.navStack.push(S.page);
  S.page = page;
  render();
}
function goBack() {
  const prev = S.navStack.pop();
  S.page = prev || 'welcome';
  render();
}
function goWelcome() {
  S.navStack = [];
  S.page = 'welcome';
  render();
}

// ─── FIREBASE ─────────────────────────────────────────
function fbInit(cfg) {
  try {
    if (firebase.apps.length) firebase.apps.forEach(a => a.delete());
    firebase.initializeApp(cfg);
    S.db = firebase.firestore();
    S.storage = firebase.storage();
    return true;
  } catch(e) { console.error(e); return false; }
}

async function nextId(type) {
  const ref = S.db.collection('_counters').doc(type);
  return S.db.runTransaction(async t => {
    const doc = await t.get(ref);
    const n = (doc.exists ? doc.data().n : 0) + 1;
    t.set(ref, { n }, { merge: true });
    return type === 'items' ? `RUF-${String(n).padStart(3,'0')}` : type === 'consumables' ? `CLOG-${String(n).padStart(3,'0')}` : type === 'orders' ? `ORD-${String(n).padStart(3,'0')}` : `LOG-${String(n).padStart(3,'0')}`;
  });
}

async function loadItems() {
  const snap = await S.db.collection('items').orderBy('dateAdded','desc').get();
  return snap.docs.map(d => ({ ...d.data() }));
}

async function loadItem(id) {
  const doc = await S.db.collection('items').doc(id).get();
  return doc.exists ? { ...doc.data() } : null;
}

async function writeItem(id, data) {
  await S.db.collection('items').doc(id).set(data, { merge: true });
}

async function removeItem(item) {
  await S.db.collection('items').doc(item.id).delete();
  const photos = itemPhotos(item);
  if (photos.length) {
    for (const p of photos) { if (p.path) { try { await S.storage.ref(p.path).delete(); } catch(e){} } }
  } else {
    try { await S.storage.ref(`items/${item.id}.jpg`).delete(); } catch(e){} // legacy single-photo items
  }
}

async function uploadPhoto(b64, id, idx) {
  const path = `items/${id}/${idx}_${Date.now()}.jpg`;
  const ref = S.storage.ref(path);
  await ref.putString(b64, 'base64', { contentType:'image/jpeg' });
  const url = await ref.getDownloadURL();
  return { url, path };
}

// Back-compat: legacy items only ever had a single photoUrl, no photos[] array.
function itemPhotos(item) {
  if (item.photos && item.photos.length) return item.photos;
  if (item.photoUrl) return [{ url: item.photoUrl, path: null }];
  return [];
}

// Reusable add/edit photo manager: tiles with cover star + remove x + an "add" tile.
function photoStrip(photos, thumbIdx, onSetCover, onRemove, onAdd) {
  const strip = div({ class: 'photo-strip' });
  photos.forEach((p, i) => {
    const tile = div({ class: 'photo-tile' + (i === thumbIdx ? ' cover' : ''), onclick: () => onSetCover(i) });
    tile.appendChild(el('img', { src: p.url || ('data:image/jpeg;base64,' + p.b64), alt: 'Photo ' + (i + 1) }));
    if (i === thumbIdx) tile.appendChild(el('span', { class: 'photo-tile-star' }, '★ Cover'));
    const xBtn = el('button', { type: 'button', class: 'photo-tile-x' }, '×');
    xBtn.onclick = (e) => { e.stopPropagation(); onRemove(i); };
    tile.appendChild(xBtn);
    strip.appendChild(tile);
  });
  if (photos.length < MAX_PHOTOS) {
    const addTile = div({ class: 'photo-tile-add' }, '+');
    addTile.onclick = onAdd;
    strip.appendChild(addTile);
  }
  return strip;
}

// Full-screen viewer for an item's photo(s) — set S.galleryPhotos/S.galleryIdx and render() to open.
function galleryOverlay() {
  if (!S.galleryPhotos || !S.galleryPhotos.length) return null;
  const photos = S.galleryPhotos;
  const ov = div({ class: 'modal-overlay', style: { cursor: 'zoom-out', flexDirection: 'column', gap: '16px' } });
  ov.onclick = () => { S.galleryPhotos = null; render(); };
  const imgWrap = div({ style: { position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' } });
  const img = el('img', { src: photos[S.galleryIdx].url, alt: 'Photo', style: { maxWidth: '90vw', maxHeight: '75vh', borderRadius: '10px', boxShadow: '0 20px 60px rgba(0,0,0,.4)', cursor: 'default' } });
  img.onclick = e => e.stopPropagation();
  imgWrap.appendChild(img);
  if (photos.length > 1) {
    const prev = el('button', { class: 'gallery-arrow', style: { left: '-8px' } }, '‹');
    prev.onclick = (e) => { e.stopPropagation(); S.galleryIdx = (S.galleryIdx - 1 + photos.length) % photos.length; render(); };
    const next = el('button', { class: 'gallery-arrow', style: { right: '-8px' } }, '›');
    next.onclick = (e) => { e.stopPropagation(); S.galleryIdx = (S.galleryIdx + 1) % photos.length; render(); };
    imgWrap.appendChild(prev); imgWrap.appendChild(next);
  }
  ov.appendChild(imgWrap);
  if (photos.length > 1) {
    const dots = div({ style: { display: 'flex', gap: '8px' } });
    photos.forEach((p, i) => {
      const d = el('span', { class: 'gallery-dot', style: { background: i === S.galleryIdx ? '#fff' : 'rgba(255,255,255,.4)' } });
      d.onclick = (e) => { e.stopPropagation(); S.galleryIdx = i; render(); };
      dots.appendChild(d);
    });
    ov.appendChild(dots);
  }
  return ov;
}

async function loadLogs(itemId) {
  const snap = await S.db.collection('borrowLogs')
    .where('itemId','==',itemId).orderBy('borrowDate','desc').get();
  return snap.docs.map(d => ({ ...d.data() }));
}

async function writeLog(logId, data) {
  await S.db.collection('borrowLogs').doc(logId).set(data, { merge: true });
}

async function loadConsumableLogs(itemId) {
  const snap = await S.db.collection('consumableLogs')
    .where('itemId','==',itemId).get();
  const logs = snap.docs.map(d => ({ ...d.data() }));
  // Sort newest first client-side (avoids needing a composite index)
  logs.sort((a,b)=>{
    const ta=a.timestamp&&a.timestamp.toDate?a.timestamp.toDate().getTime():0;
    const tb=b.timestamp&&b.timestamp.toDate?b.timestamp.toDate().getTime():0;
    return tb-ta;
  });
  return logs;
}

  await S.db.collection('consumableLogs').doc(logId).set(data, { merge: true });
}

// ─── ORDERS (merch) ───────────────────────────────────
// Order statuses: 'awaiting-payment' (booth, at counter) | 'pending' (online, payment claimed)
//                 → 'fulfilled' (stock deducted) | 'cancelled' (reservation released)
const ACTIVE_ORDER_STATUSES = ['awaiting-payment','pending'];

function subscribeOrders() {
  if (S.ordersUnsub || !S.db) return;
  S.ordersUnsub = S.db.collection('orders').onSnapshot(snap => {
    S.orders = snap.docs.map(d => ({ ...d.data() }));
    S.orders.sort((a,b) => {
      const ta=a.createdAt&&a.createdAt.toDate?a.createdAt.toDate().getTime():0;
      const tb=b.createdAt&&b.createdAt.toDate?b.createdAt.toDate().getTime():0;
      return tb-ta;
    });
    // Live-refresh pages that display order/stock state (no text inputs on these)
    if (['shop','pay','orders','order-ok','home'].includes(S.page)) render();
  }, err => console.error('orders listener', err));
}

function reservedQty(itemId) {
  return (S.orders||[]).filter(o => ACTIVE_ORDER_STATUSES.includes(o.status))
    .reduce((sum,o) => sum + (o.items||[]).filter(li => li.itemId===itemId)
      .reduce((a,li) => a+(li.qty||0), 0), 0);
}

function availableStock(item) {
  return Math.max(0, (item.inventoryCount||0) - reservedQty(item.id));
}

function merchItems() {
  return S.items.filter(i => (i.category||'').trim().toLowerCase()==='merch' && i.isConsumable);
}

function cartLines() {
  return Object.entries(S.cart).map(([id,qty]) => {
    const item = S.items.find(i => i.id===id);
    return item && qty>0 ? { item, qty } : null;
  }).filter(Boolean);
}

function cartTotal() {
  return cartLines().reduce((s,l) => s + (Number(l.item.unitPrice)||0)*l.qty, 0);
}

const fmtRM = n => 'RM ' + (Number(n)||0).toFixed(2);

async function placeOrder(type, extra={}) {
  const orderId = await nextId('orders');
  const lines = cartLines().map(l => ({
    itemId: l.item.id, name: l.item.name, qty: l.qty,
    unitPrice: Number(l.item.unitPrice)||0
  }));
  const order = {
    orderId, type, // 'online' | 'booth'
    status: type==='booth' ? 'awaiting-payment' : 'pending',
    customer: {
      name: S.checkoutForm.name.trim(),
      phone: S.checkoutForm.phone.trim(),
      email: S.checkoutForm.email.trim()
    },
    items: lines,
    total: lines.reduce((s,l) => s + l.unitPrice*l.qty, 0),
    createdAt: firebase.firestore.Timestamp.now(),
    fulfilledAt: null, cancelledAt: null,
    receiptUrl: null, fulfilPhotoUrl: null,
    ...extra
  };
  await S.db.collection('orders').doc(orderId).set(order);
  return order;
}

// Deducts stock + marks fulfilled atomically (safe if two staff tap at once)
async function fulfilOrderTx(orderId, extra={}) {
  const oref = S.db.collection('orders').doc(orderId);
  await S.db.runTransaction(async t => {
    const osnap = await t.get(oref);
    if (!osnap.exists) throw new Error('Order not found.');
    const cur = osnap.data();
    if (cur.status==='fulfilled') throw new Error('Order already fulfilled.');
    if (cur.status==='cancelled') throw new Error('Order was cancelled.');
    const irefs = (cur.items||[]).map(li => S.db.collection('items').doc(li.itemId));
    const isnaps = [];
    for (const r of irefs) isnaps.push(await t.get(r));
    isnaps.forEach((s,idx) => {
      const li = cur.items[idx];
      const count = s.exists ? (s.data().inventoryCount||0) : 0;
      t.set(irefs[idx], { inventoryCount: Math.max(0, count-(li.qty||0)) }, { merge:true });
    });
    t.set(oref, { status:'fulfilled', fulfilledAt: firebase.firestore.Timestamp.now(), ...extra }, { merge:true });
  });
  // Record sale entries in each item's change log (best effort, after tx)
  try {
    const osnap = await S.db.collection('orders').doc(orderId).get();
    const o = osnap.data();
    for (const li of (o.items||[])) {
      const idoc = await S.db.collection('items').doc(li.itemId).get();
      const logId = await nextId('consumables');
      await writeConsumableLog(logId, {
        logId, itemId: li.itemId, itemName: li.name,
        type: 'take', takenBy: `${o.customer?.name||'Customer'} · ${orderId}`,
        contact: o.customer?.phone||'', quantity: li.qty||0,
        reason: o.type==='booth' ? 'Merch sale (booth)' : 'Merch order (online)',
        remainingAfter: idoc.exists ? (idoc.data().inventoryCount||0) : null,
        timestamp: firebase.firestore.Timestamp.now()
      });
    }
  } catch(e) { console.warn('sale log failed', e); }
}

async function cancelOrder(orderId, reason) {

async function verifyPin(pin) {
  const hash = await sha256(pin);
  return hash === "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
}

// ─── UTILS ────────────────────────────────────────────
async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function resizeImg(file, maxPx=800) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxPx / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.78).split(',')[1]);
    };
    img.src = url;
  });
}

// ─── BOXES ────────────────────────────────────────────
// A box is declared by the explicit isBox flag (toggle in the logger),
// NOT by its category. Category stays descriptive ('Box' suggested).
// Items inside a box can be borrowed individually (regular borrow flow +
// log), but must be returned into the box.
// isBoxCat() exists only to migrate legacy 'Box / Storage'-categorised docs.
function isBoxCat(cat) {
  const c = (cat||'').trim().toLowerCase().replace(/\s+/g,'');
  return c==='box/storage' || c==='box' || c==='storage' || c==='boxstorage';
}
function isBox(item) { return !!item && item.isBox===true; }
function boxContents(boxId) { return S.items.filter(i => i.boxId===boxId); }
function itemBox(item) { return (item && item.boxId) ? (S.items.find(i => i.id===item.boxId)||null) : null; }
function allBoxes() { return S.items.filter(isBox); }
// Items eligible to be placed in a box: non-consumable, not a box themselves (no nesting)
function boxableItems() { return S.items.filter(i => !i.isConsumable && !isBox(i)); }
function effectiveLocation(item) {
  const b = itemBox(item);
  if (b) return b.status==='Borrowed' ? `In ${b.id} · with ${b.borrowedBy||'borrower'}` : `In ${b.id}${b.storageLocation?' · '+b.storageLocation:''}`;
  return item.status==='Borrowed' ? 'With borrower' : (item.storageLocation||'—');
}

function isOverdue(item) {
  return item.status === 'Borrowed' && item.expectedReturn &&
    new Date() > (item.expectedReturn.toDate ? item.expectedReturn.toDate() : new Date(item.expectedReturn));
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
}

function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-MY',{day:'numeric',month:'short'}) + ' at ' +
    d.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
}

function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), dur);
}

// ─── DOM HELPERS ──────────────────────────────────────
function el(tag, props={}, ...kids) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k==='style' && typeof v==='object') Object.assign(e.style,v);
    else if (k==='class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k,v);
  }
  kids.forEach(k => { if (k!=null) e.appendChild(typeof k==='string' ? document.createTextNode(k) : k); });
  return e;
}
const div = (p,...k) => el('div',p,...k);
function btn(cls, html, onclick) {
  const b = document.createElement('button');
  b.className='btn '+cls; b.innerHTML=html; b.onclick=onclick; return b;
}
function field(label, input) {
  const w = div({class:'field'});
  w.appendChild(el('label',{},label)); w.appendChild(input); return w;
}
function inp(type, val, ph, oninput) {
  const i = el('input',{type,placeholder:ph}); i.value=val;
  i.oninput=e=>oninput(e.target.value); return i;
}
function sel(val, opts, onchange) {
  const s = el('select');
  opts.forEach(o => { const op=el('option',{value:o},o); if(o===val)op.selected=true; s.appendChild(op); });
  s.onchange=e=>onchange(e.target.value); return s;
}
function hdr(title, backPage, backFn, actionLabel, actionFn) {
  const h = div({class:'hdr'});
  if (backPage||backFn) {
    h.appendChild(el('span',{class:'hdr-back',onclick:()=>{ if(backFn)backFn(); else goBack(); }},'←'));
  }
  h.appendChild(el('span',{class:'hdr-title'},title));
  if (actionLabel) h.appendChild(el('span',{class:'hdr-action',onclick:actionFn},actionLabel));
  h.appendChild(el('span',{class:'hdr-action',style:{fontSize:'18px',opacity:'.85'},onclick:()=>goWelcome()},'⌂'));
  return h;
}
function badge(item) {
  if (item.isConsumable) {
    const inStock = (item.inventoryCount||0) > 0;
    return el('span',{class:'badge '+(inStock?'b-avail':'b-missing')}, inStock?'In Stock':'Out of Stock');
  }
  if (item.boxId && item.status!=='Borrowed') {
    const b = itemBox(item);
    if (b && b.status==='Borrowed') return el('span',{class:'badge b-borrow'},'In Borrowed Box');
  }
  const ov = isOverdue(item);
  const cls = ov ? 'b-overdue' : item.status==='Available' ? 'b-avail' : item.status==='Borrowed' ? 'b-borrow' : 'b-missing';
  return el('span',{class:'badge '+cls}, ov?'Overdue':item.status);
}

function filteredItems() {
  const borrowerMode = S.borrowerMode;
  return S.items.filter(item => {
    if(S.takeMode){ if(!item.isConsumable) return false; }

    else { /* admin sees all */ }
    const mf = (S.filter==='All' || item.category===S.filter);
    const sf = S.statusFilter==='All' || (S.statusFilter==='Overdue'&&isOverdue(item)) ||
               (S.statusFilter!=='Overdue'&&item.status===S.statusFilter);
    const bf = S.borrowFilter==='All' ||
               (S.borrowFilter==='Yes' && item.availableForBorrow!==false) ||
               (S.borrowFilter==='No' && item.availableForBorrow===false);
    const cf = S.consumableFilter==='All' ||
               (S.consumableFilter==='Consumable' && item.isConsumable===true) ||
               (S.consumableFilter==='Non-Consumable' && item.isConsumable!==true);
    const ms = !S.search || [item.name,item.id,item.storageLocation].some(v=>v?.toLowerCase().includes(S.search.toLowerCase()));
    return mf && sf && bf && cf && ms;
  });
}

function sortedItems(items) {
  return [...items].sort((a,b) => {
    let va=a[S.sortField]||'', vb=b[S.sortField]||'';
    if (typeof va==='boolean') va=va?'1':'0';
    if (typeof vb==='boolean') vb=vb?'1':'0';
    const cmp = String(va).localeCompare(String(vb), undefined, {numeric:true});
    return S.sortDir==='asc' ? cmp : -cmp;
  });
}

function mkChk(allowed) {
  return el('span',{style:{width:'15px',height:'15px',border:'1.5px solid '+(allowed===false?'#ccc':'var(--green)'),
    borderRadius:'3px',display:'inline-flex',alignItems:'center',justifyContent:'center',
    fontSize:'10px',color:'var(--green)',flexShrink:'0'}}, allowed===false?'':'✓');
}

function navToItem(item) {
  return async ()=>{S.currentItem=item;S.currentLogs=[];go('detail');S.currentLogs=item.isConsumable?await loadConsumableLogs(item.id):await loadLogs(item.id);renderLogs();};
}

function updateList() {
  const borrowerMode = S.borrowerMode;
  const c = document.getElementById('list-container');
  if (!c) return;
  c.innerHTML = '';
  // Update grid style (responsive via .bento-grid class)
  c.classList.toggle('bento-grid', S.viewMode==='bento');
  c.style.display = S.viewMode==='bento' ? '' : 'block';

  // Update toggle icon
  const tb=document.getElementById('view-toggle-btn');
  if(tb) tb.textContent=S.viewMode==='bento'?'☰':'⊞';
  const items = sortedItems(filteredItems());
  if (!items.length) {
    c.classList.remove('bento-grid');
    c.style.display='block';
    c.appendChild(el('p',{style:{color:'var(--gray)',textAlign:'center',padding:'30px 0'}},'No items found.'));
    return;
  }

  if (S.viewMode==='sheet') {
    // ── SHEET VIEW ──────────────────────────────
    const cols=[
      {key:'id',label:'Code'},
      {key:'name',label:'Name'},
      {key:'category',label:'Category'},
      {key:'storageLocation',label:'Storage Location'},
      {key:'status',label:'Status'},
      ...(S.borrowerMode?[]:[{key:'borrowedBy',label:'Currently With'}]),
      ...(S.borrowerMode?[]:[{key:'availableForBorrow',label:'Borrowing Allowed?'}]),
    ];
    const wrap=div({class:'sheet-wrap'});
    const table=el('table',{class:'sheet-table'});
    const thead=el('thead'), hrow=el('tr');
    cols.forEach(col=>{
      const arrow=S.sortField===col.key?(S.sortDir==='asc'?' ↑':' ↓'):'';
      const th=el('th',{onclick:()=>{
        S.sortField===col.key?S.sortDir=(S.sortDir==='asc'?'desc':'asc'):(S.sortField=col.key,S.sortDir='asc');
        updateList();
      }},col.label+arrow);
      hrow.appendChild(th);
    });
    thead.appendChild(hrow); table.appendChild(thead);
    const tbody=el('tbody');
    items.forEach(item=>{
      const row=el('tr',{onclick:navToItem(item)});
      const tdStyle={padding:'10px 14px',borderBottom:'1px solid var(--border)',verticalAlign:'middle'};
      const addTd=(content,extra={})=>{
        const td=el('td',{style:{...tdStyle,...extra}});
        if(typeof content==='string'||typeof content==='number') td.textContent=content||'—';
        else if(content) td.appendChild(content);
        row.appendChild(td);
      };
      addTd(item.id,{fontWeight:'700',color:'var(--navy)',fontSize:'12px',letterSpacing:'.4px'});
      addTd(item.name||'—',{fontWeight:'600'});
      addTd(item.category||'—');
      addTd(effectiveLocation(item));
      addTd(badge(item));
      if(!S.borrowerMode) addTd(item.status==='Borrowed'?(item.borrowedBy||'Unknown'):'None');
      if(!S.borrowerMode) addTd(mkChk(item.availableForBorrow));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    c.appendChild(wrap);
  } else {
    // ── BENTO VIEW ──────────────────────────────
    items.forEach(item=>{
      const card=div({class:'card',style:{marginBottom:'0'},onclick:navToItem(item)});
      if(item.photoUrl) card.appendChild(el('img',{class:'card-photo',src:item.photoUrl,alt:item.name,loading:'lazy'}));
      card.appendChild(el('div',{class:'card-id'},item.id));
      card.appendChild(el('div',{class:'card-name'},item.name||'—'));
      const meta=div({class:'card-meta'});
      meta.appendChild(el('span',{style:{fontSize:'12px',color:'var(--gray)'}},item.category||''));
      meta.appendChild(badge(item));
      card.appendChild(meta);
      // Box hints
      if(item.boxId) card.appendChild(div({style:{marginTop:'6px',fontSize:'12px',fontWeight:'700',color:'var(--navy)'}},'🧰 In '+item.boxId));
      else if(isBox(item)){ const n=boxContents(item.id).length; card.appendChild(div({style:{marginTop:'6px',fontSize:'12px',fontWeight:'700',color:'var(--navy)'}},`🧰 Box · ${n} item${n===1?'':'s'}`)); }
      // Indicator — hide in borrower mode
      if(!borrowerMode){
        if(item.isConsumable){
          const stockInd=div({style:{marginTop:'8px',fontSize:'12px',fontWeight:'600',color:(item.inventoryCount||0)>0?'var(--green)':'var(--red)'}}, `Stock: ${item.inventoryCount||0}`);
          card.appendChild(stockInd);
        } else {
          const allowed=item.availableForBorrow!==false;
          const availInd=div({style:{marginTop:'8px',display:'flex',alignItems:'center',gap:'6px',fontSize:'12px',color:allowed?'var(--green)':'var(--red)'}});
          availInd.appendChild(mkChk(item.availableForBorrow));
          availInd.appendChild(el('span',{},'Borrowing Allowed?'));
          card.appendChild(availInd);
        }
      }
      c.appendChild(card);
    });
  }
}

// DETAIL
function pageDetail() {
  const item = S.currentItem;
  if (!item) { go('home'); return div({}); }
  const ov = isOverdue(item);
  const pg = div({});

  pg.appendChild(hdr(item.id, null, ()=>goBack(),
    'Edit', ()=>checkAdmin(()=>{S.editForm=null;S.editPhotosInit=false;S.confirmDel=false;go('edit');})
  ));

  const dPhotos=itemPhotos(item);
  if (item.photoUrl) {
    let coverIdx=dPhotos.findIndex(p=>p.url===item.photoUrl); if(coverIdx<0) coverIdx=0;
    const dWrap=div({style:{position:'relative',cursor:'pointer'},onclick:()=>{S.galleryPhotos=dPhotos;S.galleryIdx=coverIdx;render();}});
    dWrap.appendChild(el('img',{class:'detail-photo',src:item.photoUrl,alt:item.name}));
    if (dPhotos.length>1) dWrap.appendChild(el('span',{class:'gallery-count-badge'},'📷 '+dPhotos.length));
    pg.appendChild(dWrap);
  } else pg.appendChild(div({class:'detail-photo-ph'},'📦'));

  const body = div({class:'detail-body',style:{padding:'22px 28px'}});

  if (ov) body.appendChild(div({class:'alert al-red',style:{marginBottom:'16px'}},'Overdue since '+fmtDate(item.expectedReturn)));

  const lbl = (txt) => el('div',{style:{fontSize:'11px',fontWeight:'700',color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'4px'}},txt);
  const val = (txt) => el('div',{style:{fontSize:'15px',fontWeight:'700',color:'#000'}},txt);
  const cellStyle = {padding:'14px 16px',background:'var(--light)',borderRadius:'8px'};

  if (item.isConsumable) {
    // Consumable info grid
    const isMerch=(item.category||'').trim().toLowerCase()==='merch';
    const row1 = div({class:'detail-grid'});
    const c1=div({style:cellStyle}); c1.appendChild(lbl('Code')); c1.appendChild(val(item.id)); row1.appendChild(c1);
    const c2=div({style:cellStyle}); c2.appendChild(lbl('Category')); c2.appendChild(val(item.category||'—')); row1.appendChild(c2);
    const c3=div({style:cellStyle}); c3.appendChild(lbl('Storage Location')); c3.appendChild(val(item.storageLocation||'—')); row1.appendChild(c3);
    const row2 = div({class:'detail-grid last'});
    const c4=div({style:cellStyle}); c4.appendChild(lbl('Status')); c4.appendChild(badge(item)); row2.appendChild(c4);
    const c5=div({style:cellStyle}); c5.appendChild(lbl('In Stock'));
    const resQ=isMerch?reservedQty(item.id):0;
    c5.appendChild(val(String(item.inventoryCount||0)));
    if(resQ>0) c5.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',color:'var(--amber)',marginTop:'2px'}},`${resQ} reserved by orders`));
    row2.appendChild(c5);
    if(isMerch){
      const c6=div({style:cellStyle}); c6.appendChild(lbl('Unit Price')); c6.appendChild(val('RM '+(Number(item.unitPrice||0).toFixed(2)))); row2.appendChild(c6);
    } else {
      const c6=div({style:cellStyle}); c6.appendChild(lbl('Type')); c6.appendChild(val('Consumable')); row2.appendChild(c6);
    }
    body.appendChild(row1); body.appendChild(row2);
  } else {
    // Borrowable item info grid
    const currentLoc = effectiveLocation(item);
    const currentWith = item.status==='Borrowed' ? (item.borrowedBy||'Unknown') : 'None';
    const row1 = div({class:'detail-grid'});
    const c1=div({style:cellStyle}); c1.appendChild(lbl('Code')); c1.appendChild(val(item.id)); row1.appendChild(c1);
    const c2=div({style:cellStyle}); c2.appendChild(lbl('Category')); c2.appendChild(val(item.category||'—')); row1.appendChild(c2);
    const c3=div({style:cellStyle}); c3.appendChild(lbl('Storage Location')); c3.appendChild(val(item.boxId?('🧰 '+item.boxId):(item.storageLocation||'—'))); row1.appendChild(c3);
    const row2 = div({class:'detail-grid last'});
    const c4=div({style:cellStyle}); c4.appendChild(lbl('Status')); c4.appendChild(badge(item)); row2.appendChild(c4);
    const c5=div({style:cellStyle}); c5.appendChild(lbl('Current Location')); c5.appendChild(val(currentLoc)); row2.appendChild(c5);
    const c6=div({style:cellStyle}); c6.appendChild(lbl('Currently With')); c6.appendChild(val(currentWith)); row2.appendChild(c6);
    body.appendChild(row1); body.appendChild(row2);

    // Kept inside a box?
    if (item.boxId) {
      const b = itemBox(item);
      const kitAl = div({class:'alert al-navy',style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px',flexWrap:'wrap'}});
      kitAl.appendChild(el('span',{},`🧰 Kept in box ${item.boxId}${b&&b.name?' — '+b.name:''}. You can borrow it on its own, but please return it into this box.`));
      if (b) kitAl.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{padding:'8px 16px',fontSize:'13px'},onclick:navToItem(b)},'View Box'));
      body.appendChild(kitAl);
    }

    // Box contents (visible to everyone)
    if (isBox(item)) {
      const contents = boxContents(item.id);
      body.appendChild(div({class:'divider'}));
      const secHead = div({style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px',marginBottom:'10px',flexWrap:'wrap'}});
      secHead.appendChild(el('div',{class:'section-title',style:{marginBottom:'0'}},`🧰 Box Contents (${contents.length})`));
      secHead.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{padding:'8px 16px',fontSize:'13px'},onclick:()=>checkAdmin(()=>{
        S.boxManageSel=null;S.boxManageSearch='';go('box-manage');
      })},'Manage Contents'));
      body.appendChild(secHead);
      if (!contents.length) {
        body.appendChild(el('p',{style:{color:'var(--gray)',fontSize:'14px',marginBottom:'10px'}},'This box is empty. Use Manage Contents to add items.'));
      } else {
        body.appendChild(div({class:'alert al-navy'},'Borrowing this box borrows everything inside it.'));
        contents.forEach(c => {
          const row = div({class:'cart-line',style:{cursor:'pointer'},onclick:navToItem(c)});
          if (c.photoUrl) row.appendChild(el('img',{src:c.photoUrl,alt:c.name,loading:'lazy'}));
          else row.appendChild(div({style:{width:'56px',height:'56px',borderRadius:'8px',background:'var(--light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px',flexShrink:'0'}},'📦'));
          const info = div({class:'cart-line-info'});
          info.appendChild(div({class:'cart-line-name'},c.name||'—'));
          info.appendChild(div({class:'cart-line-price'},c.id));
          row.appendChild(info);
          row.appendChild(el('span',{style:{color:'var(--gray)',fontSize:'18px'}},'›'));
          body.appendChild(row);
        });
      }
    }

    // Borrowing Allowed? row — hide in borrower mode
    if(!S.borrowerMode){
      const allowed=item.availableForBorrow!==false;
      const row3 = div({style:{display:'flex',alignItems:'center',gap:'8px',padding:'12px 16px',background:'var(--light)',borderRadius:'8px',marginBottom:'10px'}});
      const avLbl=el('div',{style:{fontSize:'12px',fontWeight:'700',color:allowed?'var(--gray)':'var(--red)',textTransform:'uppercase',letterSpacing:'.5px',marginRight:'8px'}},'Borrowing Allowed?');
      const avChk=el('span',{style:{width:'16px',height:'16px',border:'1.5px solid '+(allowed?'var(--green)':'#ccc'),borderRadius:'3px',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'11px',color:'var(--green)',flexShrink:'0'}}, allowed?'✓':'');
      row3.appendChild(avLbl); row3.appendChild(avChk);
      body.appendChild(row3);
    }
  }

  // Action buttons (show in borrower mode or QR scan)
  if (S.borrowerMode || S.qrItemId) {
    body.appendChild(div({class:'divider'}));
    const actionRow=div({style:{display:'flex',flexDirection:'column',gap:'10px'}});
    if (item.isConsumable) {
      // Take This Item
      const tb=el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{
        if((item.inventoryCount||0)<=0){
          tb.classList.remove('shake'); void tb.offsetWidth; tb.classList.add('shake');
          setTimeout(()=>tb.classList.remove('shake'),400);
          toast('This item is out of stock.');
          return;
        }
        S.showTakePopup=true;render();
      }},'Take This Item');
      actionRow.appendChild(tb);
    } else {
      // Borrow This Item (items inside a box can be borrowed individually)
      const bb=el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{
        S.showBorrowPopup=true;render();
      }},'Borrow This Item');
      actionRow.appendChild(bb);
      // Return This Item — shake with toast if not borrowed
      const rb=el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{
        if(item.status!=='Borrowed'){
          rb.classList.remove('shake');
          void rb.offsetWidth;
          rb.classList.add('shake');
          setTimeout(()=>rb.classList.remove('shake'),400);
          toast('This item is not currently borrowed.');
          return;
        }
        S.retConfirmed=false;S.retLocation='';go('return');
      }},'Return This Item');
      actionRow.appendChild(rb);
    }
    body.appendChild(actionRow);
  }

  if(!S.borrowerMode){
    body.appendChild(div({class:'divider'}));
    body.appendChild(el('div',{class:'section-title'},item.isConsumable?'Inventory Change Log':'Borrow History'));
    const logsEl=div({id:'detail-logs'});
    logsEl.appendChild(el('p',{style:{color:'var(--gray)',fontSize:'14px'}},'Loading...'));
    body.appendChild(logsEl);
  }
  // Borrow popup modal
  if(S.showBorrowPopup){
    const overlay=div({class:'modal-overlay',onclick:()=>{S.showBorrowPopup=false;render();}});
    const box=div({class:'modal-box',onclick:e=>e.stopPropagation()});
    const brwBox=itemBox(item);
    if(item.status==='Borrowed'){
      // Already borrowed by someone else
      box.appendChild(el('div',{class:'modal-icon'},'⚠️'));
      box.appendChild(el('div',{class:'modal-title'},'Item Currently In Use'));
      const bp=el('p',{class:'modal-body'});
      bp.innerHTML=`This item is currently borrowed by <strong>${item.borrowedBy||'someone'}</strong>. Please check with them directly.`;
      box.appendChild(bp);
      const btns=div({class:'modal-btns'});
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showBorrowPopup=false;render();}},'OK'));
      box.appendChild(btns);
    } else if(brwBox && brwBox.status==='Borrowed'){
      // Inside a box that is currently borrowed as a whole
      box.appendChild(el('div',{class:'modal-icon'},'🧰'));
      box.appendChild(el('div',{class:'modal-title'},'Box Currently In Use'));
      const bp=el('p',{class:'modal-body'});
      bp.innerHTML=`This item is inside <strong>${brwBox.id}${brwBox.name?' — '+brwBox.name:''}</strong>, which is currently borrowed by <strong>${brwBox.borrowedBy||'someone'}</strong>. Please check with them directly.`;
      box.appendChild(bp);
      const btns=div({class:'modal-btns'});
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showBorrowPopup=false;render();}},'OK'));
      box.appendChild(btns);
    } else {
      // Available
      box.appendChild(el('div',{class:'modal-icon'},'📍'));
      box.appendChild(el('div',{class:'modal-title'},'Collect the item first'));
      let kitNote='';
      if(isBox(item)&&boxContents(item.id).length){
        const contents=boxContents(item.id);
        kitNote=` This box contains <strong>${contents.length} item${contents.length>1?'s':''}</strong> — they go with it.`;
        const out=contents.filter(c=>c.status==='Borrowed');
        if(out.length) kitNote+=` Note: <strong>${out.length}</strong> of them ${out.length>1?'are':'is'} currently borrowed out individually and may not be inside.`;
      }
      const boxNote=brwBox?` Remember to <strong>return it into box ${brwBox.id}</strong> when you're done.`:'';
      const collectFrom=brwBox?`box <span class="modal-loc">${brwBox.id}${brwBox.storageLocation?' · '+brwBox.storageLocation:''}</span>`:(item.storageLocation?`<span class="modal-loc">${item.storageLocation}</span>`:'');
      const locTxt=(collectFrom?`Please collect the item from ${collectFrom} before confirming.`:'Please collect the item before confirming.')+kitNote+boxNote;
      const bodyP=el('p',{class:'modal-body'}); bodyP.innerHTML=locTxt;
      box.appendChild(bodyP);
      const btns=div({class:'modal-btns'});
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showBorrowPopup=false;S.borrowDirectAccess=true;S.borrowForm={name:'',contact:'',reason:'',returnDate:''};go('borrow');}},'The Item is with me now'));
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showBorrowPopup=false;render();}},'OK'));
      box.appendChild(btns);
    }
    overlay.appendChild(box);
    pg.appendChild(overlay);
  }

  // Take popup modal
  if(S.showTakePopup){
    const overlay=div({class:'modal-overlay',onclick:()=>{S.showTakePopup=false;render();}});
    const box=div({class:'modal-box',onclick:e=>e.stopPropagation()});
    if((item.inventoryCount||0)<=0){
      box.appendChild(el('div',{class:'modal-icon'},'⚠️'));
      box.appendChild(el('div',{class:'modal-title'},'Out of Stock'));
      const bp=el('p',{class:'modal-body'}); bp.textContent='This item is currently out of stock.';
      box.appendChild(bp);
      const btns=div({class:'modal-btns'});
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showTakePopup=false;render();}},'OK'));
      box.appendChild(btns);
    } else {
      box.appendChild(el('div',{class:'modal-icon'},'📦'));
      box.appendChild(el('div',{class:'modal-title'},'Collect the item first'));
      const locTxt=item.storageLocation?`Please collect from <span class="modal-loc">${item.storageLocation}</span> before confirming. <strong>${item.inventoryCount}</strong> available.`:`Please collect the item first. <strong>${item.inventoryCount}</strong> available.`;
      const bodyP=el('p',{class:'modal-body'}); bodyP.innerHTML=locTxt;
      box.appendChild(bodyP);
      const btns=div({class:'modal-btns'});
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showTakePopup=false;S.takeDirectAccess=true;S.takeForm={name:'',contact:'',quantity:1,reason:''};go('take');}},'I have the item now'));
      btns.appendChild(el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>{S.showTakePopup=false;render();}},'OK'));
      box.appendChild(btns);
    }
    overlay.appendChild(box);
    pg.appendChild(overlay);
  }

  // Enlarged return photo modal — close by removing from DOM (no re-render, keeps logs intact)
  if(S.enlargedPhoto){
    const ov=div({id:'enlarged-photo-ov',class:'modal-overlay',style:{cursor:'zoom-out'}});
    ov.onclick=()=>{S.enlargedPhoto=null; const o=document.getElementById('enlarged-photo-ov'); if(o) o.remove();};
    const img=el('img',{src:S.enlargedPhoto,alt:'Return photo',style:{maxWidth:'90vw',maxHeight:'85vh',borderRadius:'10px',boxShadow:'0 20px 60px rgba(0,0,0,.4)'}});
    img.onclick=e=>e.stopPropagation();
    ov.appendChild(img);
    pg.appendChild(ov);
  }

  pg.appendChild(body);
  return pg;
}

function renderLogs() {
  const el2=document.getElementById('detail-logs');
  if (!el2) return;
  el2.innerHTML='';
  if (!S.currentLogs.length) { el2.appendChild(el('p',{style:{color:'var(--gray)',fontSize:'14px'}},'No history yet.')); return; }
  const isCons = S.currentItem && S.currentItem.isConsumable;
  S.currentLogs.forEach(log => {
    if (isCons) {
      // Consumable change log entry
      const isRestock = log.type==='restock';
      const li=div({class:'log-item'});
      const top=div({style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'12px'}});
      top.appendChild(el('div',{class:'log-borrower'},isRestock?'Restock':(log.takenBy||'?')));
      const delta=el('div',{style:{fontWeight:'700',fontSize:'15px',color:isRestock?'var(--green)':'var(--red)'}}, (isRestock?'+':'−')+(log.quantity||0));
      top.appendChild(delta);
      li.appendChild(top);
      li.appendChild(el('div',{class:'log-meta'},fmtDateTime(log.timestamp)+'  ·  Remaining: '+(log.remainingAfter!=null?log.remainingAfter:'—')));
      if (log.reason) li.appendChild(el('div',{class:'log-meta'},'Reason: '+log.reason));
      if (log.contact) li.appendChild(el('div',{class:'log-meta'},'Contact: '+log.contact));
      el2.appendChild(li);
      return;
    }
    const active=!log.actualReturn;
    const li=div({class:'log-item',style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'16px'}});
    const info=div({style:{flex:'1'}});
    info.appendChild(el('div',{class:'log-borrower'},log.borrowedBy||'?'));
    info.appendChild(el('div',{class:'log-meta'},'Borrowed: '+fmtDateTime(log.borrowDate)+(log.actualReturn?' · Returned: '+fmtDateTime(log.actualReturn):'')));
    if (log.reason) info.appendChild(el('div',{class:'log-meta'},'Reason: '+log.reason));
    if (log.returnLocation&&log.actualReturn) info.appendChild(el('div',{class:'log-meta'},'📍 Left at: '+log.returnLocation));
    info.appendChild(el('div',{class:'log-dot',style:{color:active?'var(--amber)':'var(--green)'}},active?'● Active':'✓ Returned'));

async function runAI() {
  if (!S.photos.length) { S.addStep='confirm'; render(); return; }
  const apiKey = localStorage.getItem(LS_KEY) || BAKED_KEY;
  try {
    const rsp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-goog-api-key': apiKey
      },
      body:JSON.stringify({contents:[{parts:[
        {text:`Identify this item for a Malaysian church fellowship inventory. Reply ONLY with valid JSON, no extra text:\n{"name":"specific item name","category":"one of: Merch|Decor|Box|Categorise Later","notes":"brief condition note or empty string"}`},
        {inline_data:{mime_type:'image/jpeg',data:S.photos[0].b64}}
      ]}],generationConfig:{maxOutputTokens:300,responseMimeType:'application/json'}})
    });
    if (!rsp.ok) {
      const errData = await rsp.json().catch(()=>({}));
      console.error('AI API error:', rsp.status, errData);
      toast(`AI error ${rsp.status} — fill in manually`);
    } else {
      const data=await rsp.json();
      const text=(data.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(text);
      S.addForm.name=parsed.name||'';
      S.addForm.category=parsed.category||'Categorise Later';
      S.addForm.notes=parsed.notes||'';
      const aiCat=(parsed.category||'').trim().toLowerCase();
      if(aiCat==='box'||aiCat==='booth kit'){ S.addForm.isBox=true; S.addForm.isConsumable=false; S.addForm.category='Box'; }
    }
  } catch(e) {
    console.error('AI fetch error:',e);
    toast('AI unavailable — fill in manually');
  }
  S.addStep='confirm'; render();
}

async function doSaveItem() {
  if (!S.addForm.name.trim()) { toast('Please enter an item name.'); return; }
  S.loading=true; render();
  try {
    const id=await nextId('items');
    const photos=[];
    for(let i=0;i<S.photos.length;i++){ photos.push(await uploadPhoto(S.photos[i].b64,id,i)); }
    const photoUrl=photos.length?(photos[S.thumbIdx]||photos[0]).url:null;
    const now=firebase.firestore.Timestamp.now();
    const isCons=S.addForm.isConsumable===true;
    await writeItem(id,{
      id, name:S.addForm.name.trim(), category:S.addForm.category,
      storageLocation:(S.addForm.boxId&&!isCons&&S.addForm.isBox!==true)?'':S.addForm.storageLocation.trim(), notes:S.addForm.notes.trim(),
      status:'Available', photoUrl:photoUrl||null, photos,
      availableForBorrow:isCons?false:(S.addForm.availableForBorrow!==false),
      isConsumable:isCons, inventoryCount:isCons?(parseInt(S.addForm.inventoryCount)||0):0,
      unitPrice:(S.addForm.category.trim().toLowerCase()==='merch')?(parseFloat(S.addForm.unitPrice)||0):0,
      boxId:(isCons||S.addForm.isBox===true)?null:(S.addForm.boxId||null),
      isBox:S.addForm.isBox===true&&!isCons,
      dateAdded:now, borrowedBy:null, borrowDate:null, expectedReturn:null, activeLogId:null
    });
    S.savedId=id; S.addStep='success';
    S.items=await loadItems();
  } catch(e) { console.error(e); toast('Error saving. Try again.'); }
  S.loading=false; render();
}

async function doTake() {
  if(!S.takeForm.name.trim()){toast('Please enter your name.');return;}
  if(!S.takeForm.contact.trim()){toast('Please enter your contact number.');return;}
  const qty=parseInt(S.takeForm.quantity)||0;
  if(qty<1){toast('Please enter a valid quantity.');return;}
  const avail=S.currentItem.inventoryCount||0;
  if(qty>avail){toast(`Only ${avail} available. Cannot take ${qty}.`);return;}
  S.loading=true; render();
  try {
    const now=firebase.firestore.Timestamp.now();
    const remaining=avail-qty;
    const logId=await nextId('consumables');
    await writeConsumableLog(logId,{
      logId,itemId:S.currentItem.id,itemName:S.currentItem.name,
      type:'take',takenBy:S.takeForm.name.trim(),contact:S.takeForm.contact.trim(),
      quantity:qty,reason:(S.takeForm.reason||'').trim(),
      remainingAfter:remaining,timestamp:now
    });
    await writeItem(S.currentItem.id,{inventoryCount:remaining});
    S.currentItem=await loadItem(S.currentItem.id);
    S.items=await loadItems();
    S.takeQty=qty; S.takeRemaining=remaining;
    S.page='take-ok';
  } catch(e){console.error(e);toast('Error. Try again.');}
  S.loading=false; render();
}

    `This item is with ${item.borrowedBy||'?'}. Are you ${item.borrowedBy||'?'}?`));

  if (!S.retConfirmed) {
    const ynRow=div({style:{display:'flex',gap:'12px'}});
    const yesB=el('button',{class:'btn-lift btn-lift-outline',style:{flex:'1'},onclick:()=>{S.retConfirmed=true;render();}},`Yes, I'm ${item.borrowedBy||'?'}`);
    const noB=el('button',{class:'btn-lift btn-lift-outline',style:{flex:'1'},onclick:()=>{go('detail');}},"No, it's not me");
    ynRow.appendChild(yesB); ynRow.appendChild(noB);
    body.appendChild(ynRow);
  } else {
    // Photo of returned item (required)
    body.appendChild(el('div',{class:'section-title'},'Take a photo of the item'));
    if(S.retThumb){
      body.appendChild(el('img',{class:'photo-preview',src:'data:image/jpeg;base64,'+S.retThumb}));
      const retakeRow=div({style:{marginBottom:'18px'}});
      const retakeB=el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>document.getElementById('cam-input').click()},'Retake Photo');
      retakeRow.appendChild(retakeB);
      body.appendChild(retakeRow);
    } else {
      const ph=div({class:'photo-drop',onclick:()=>document.getElementById('cam-input').click()});
      ph.appendChild(el('span',{class:'photo-drop-icon'},'📷'));
      ph.appendChild(el('span',{class:'photo-drop-label'},'Tap to take photo'));
      body.appendChild(ph);
    }
    const cam=document.getElementById('cam-input');
    cam.onchange=async e=>{const f=e.target.files[0];if(!f)return;cam.value='';S.retThumb=await resizeImg(f);render();};

    // Location — items kept in a box MUST go back into the box
    const retBox=itemBox(item);
    if(retBox){
      S.retLocation='In '+retBox.id;
      body.appendChild(el('div',{class:'section-title'},'Where does this item go?'));
      body.appendChild(div({class:'alert al-navy'},
        `🧰 This item belongs in box ${retBox.id}${retBox.name?' — '+retBox.name:''}${retBox.storageLocation?', kept at '+retBox.storageLocation:''}. Please put it back inside the box.`));
    } else {
      body.appendChild(el('div',{class:'section-title'},'Where are you leaving this item?'));
      const dynLocs=[...new Set([item.storageLocation, ...S.items.map(i=>i.storageLocation)].filter(Boolean))];
      const locOptions = dynLocs.length ? dynLocs : (item.storageLocation?[item.storageLocation]:[]);
      const grid=div({class:'loc-grid'});
      locOptions.forEach(loc=>{
        const b=el('button',{class:'loc-btn'},loc);
        if(S.retLocation===loc) b.classList.add('sel');
        b.onclick=()=>{
          S.retLocation=loc;
          grid.querySelectorAll('.loc-btn').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel');
        };
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }

    body.appendChild(el('div',{style:{height:'6px'}}));

    if(S.loading) body.appendChild(div({class:'loading-pg'},div({class:'spinner'})));
    else {
      const cr=el('button',{class:'btn-lift btn-lift-outline',style:{width:'100%'},onclick:()=>doReturn()},'Confirm Return');
      body.appendChild(cr);
    }
  }

  pg.appendChild(body); return pg;
}

async function doReturn() {
  if(!S.retThumb){toast('Please take a photo of the item.');return;}
  if(!S.retLocation){toast('Please select a location.');return;}
  S.loading=true; render();
  try {
    const now=firebase.firestore.Timestamp.now();
    // Upload return photo
    let retPhotoUrl=null;
    try {
      const ref=S.storage.ref(`returns/${S.currentItem.id}-${Date.now()}.jpg`);
      await ref.putString(S.retThumb,'base64',{contentType:'image/jpeg'});
      retPhotoUrl=await ref.getDownloadURL();
    } catch(e){console.warn('Return photo upload failed',e);}
    if(S.currentItem.activeLogId){
      await writeLog(S.currentItem.activeLogId,{actualReturn:now,returnLocation:S.retLocation,returnPhotoUrl:retPhotoUrl});
    }
    await writeItem(S.currentItem.id,{
      status:'Available',borrowedBy:null,borrowDate:null,
      expectedReturn:null,activeLogId:null,
      // Items kept in a box keep the box as their location; others get the chosen spot
      storageLocation:S.currentItem.boxId?'':S.retLocation
    });
    S.currentItem=await loadItem(S.currentItem.id);
    S.items=await loadItems();
    S.retThumb=null;
    S.page='return-ok';
  } catch(e){console.error(e);toast('Error. Try again.');}
  S.loading=false; render();
}

async function doEdit() {
  if(!S.editForm.name.trim()){toast('Name cannot be empty.');return;}
  // Guard: a box that still has contents can't stop being a box
  if(isBox(S.currentItem) && S.editForm.isBox!==true && boxContents(S.currentItem.id).length){
    toast('This box still has items inside. Remove them via Manage Contents first.');
    return;
  }
  S.loading=true; render();
  try {
    const isCons=S.editForm.isConsumable===true;
    const updates={name:S.editForm.name.trim(),category:S.editForm.category,
      storageLocation:S.editForm.storageLocation?.trim()||'',notes:S.editForm.notes.trim(),
      status:S.editForm.status,
      isConsumable:isCons,
      availableForBorrow:isCons?false:(S.editForm.availableForBorrow!==false)};
    if(isCons){ updates.inventoryCount=parseInt(S.editForm.inventoryCount)||0; }
    updates.unitPrice=((S.editForm.category||'').trim().toLowerCase()==='merch')?(parseFloat(S.editForm.unitPrice)||0):0;
    updates.isBox=S.editForm.isBox===true&&!isCons;
    updates.boxId=(isCons||updates.isBox)?null:(S.editForm.boxId||null);
    if(updates.boxId) updates.storageLocation=''; // box IS the location
    // Photos: upload any newly-picked ones, keep existing ones, delete removed ones from Storage
    const finalPhotos=[];
    for(let i=0;i<S.photos.length;i++){
      const p=S.photos[i];
      if(p.url) finalPhotos.push({url:p.url,path:p.path||null});
      else if(p.b64) finalPhotos.push(await uploadPhoto(p.b64,S.currentItem.id,i));
    }
    for(const path of S.removedPhotoPaths){ if(path){ try{ await S.storage.ref(path).delete(); }catch(e){} } }
    updates.photos=finalPhotos;
    updates.photoUrl=finalPhotos.length?(finalPhotos[S.thumbIdx]||finalPhotos[0]).url:null;
    await writeItem(S.currentItem.id,updates);
    S.currentItem=await loadItem(S.currentItem.id);
    S.items=await loadItems();
    S.editForm=null; S.editPhotosInit=false; S.confirmDel=false;
    S.page='detail'; toast('Changes saved.');
  } catch(e){console.error(e);toast('Error saving.');}
  S.loading=false; render();
}

async function doRestock() {
  const amt=parseInt(S.restockAmount)||0;
  if(amt<1){toast('Enter an amount to add.');return;}
  S.loading=true; render();
  try {
    const now=firebase.firestore.Timestamp.now();
    const current=S.currentItem.inventoryCount||0;
    const newCount=current+amt;
    const logId=await nextId('consumables');
    await writeConsumableLog(logId,{
      logId,itemId:S.currentItem.id,itemName:S.currentItem.name,
      type:'restock',quantity:amt,reason:'Restock',
      remainingAfter:newCount,timestamp:now
    });
    await writeItem(S.currentItem.id,{inventoryCount:newCount});
    S.currentItem=await loadItem(S.currentItem.id);
    S.items=await loadItems();
    S.editForm.inventoryCount=newCount;
    S.restockAmount=0;
    toast(`Restocked +${amt}. Now ${newCount}.`);
  } catch(e){console.error(e);toast('Error restocking.');}
  S.loading=false; render();
}

async function doDelete() {
  S.loading=true; render();
  try {
    // Deleting a box releases its contents (they inherit the box's last location)
    if(isBox(S.currentItem)){
      for(const c of boxContents(S.currentItem.id)) await writeItem(c.id,{boxId:null,storageLocation:S.currentItem.storageLocation||''});
    }
    await removeItem(S.currentItem);
    S.items=await loadItems();
    S.currentItem=null; S.editForm=null; S.confirmDel=false;
    goBack(); toast('Item deleted.');
  } catch(e){console.error(e);toast('Error deleting.');}
  S.loading=false; render();
}

  merch.forEach(item => {
    const avail = availableStock(item);
    const inCart = S.cart[item.id]||0;
    const card = div({class:'shop-card'});
    const sPhotos=itemPhotos(item);
    if (item.photoUrl) {
      const sWrap=div({style:{position:'relative'}});
      const sImg=el('img',{class:'shop-photo',src:item.photoUrl,alt:item.name,loading:'lazy'});
      if (sPhotos.length>1) {
        sImg.style.cursor='pointer';
        sImg.onclick=(e)=>{e.stopPropagation(); let ci=sPhotos.findIndex(p=>p.url===item.photoUrl); if(ci<0) ci=0; S.galleryPhotos=sPhotos; S.galleryIdx=ci; render();};
        sWrap.appendChild(sImg);
        sWrap.appendChild(el('span',{class:'gallery-count-badge'},'📷 '+sPhotos.length));
      } else { sWrap.appendChild(sImg); }
      card.appendChild(sWrap);
    } else card.appendChild(div({class:'shop-photo-ph'},'🛍️'));
    const info = div({class:'shop-info'});
    info.appendChild(div({class:'shop-name'},item.name||'—'));
    info.appendChild(div({class:'shop-price'},fmtRM(item.unitPrice)));
    if (avail<=0) {
      info.appendChild(el('span',{class:'badge b-missing',style:{alignSelf:'flex-start'}},'Out of stock'));
    } else {
      info.appendChild(div({class:'shop-stock'},`${avail} available`));
      const qr = div({class:'qty-row'});
      const minus = el('button',{class:'qty-btn',onclick:()=>{
        if ((S.cart[item.id]||0)>0){ S.cart[item.id]--; if(S.cart[item.id]<=0) delete S.cart[item.id]; render(); }
      }},'−');
      minus.disabled = inCart<=0;
      const plus = el('button',{class:'qty-btn',onclick:()=>{
        if ((S.cart[item.id]||0)<avail){ S.cart[item.id]=(S.cart[item.id]||0)+1; render(); }
        else toast(`Only ${avail} available.`);
      }},'+');
      plus.disabled = inCart>=avail;
      qr.appendChild(minus);
      qr.appendChild(div({class:'qty-n'},String(inCart)));
      qr.appendChild(plus);
      info.appendChild(qr);
    }
    card.appendChild(info);
    grid.appendChild(card);
  });
  body.appendChild(grid);
  pg.appendChild(body);

  // Cart bar
  const lines = cartLines();
  if (lines.length) {
    const n = lines.reduce((s,l)=>s+l.qty,0);
    const bar = div({class:'cart-bar'});
    bar.appendChild(div({class:'cart-bar-info'},`${n} item${n>1?'s':''} · ${fmtRM(cartTotal())}`));
    bar.appendChild(el('button',{class:'cart-bar-btn',onclick:()=>go('cart')},'Checkout →'));
    pg.appendChild(bar);
  }
  return pg;
}

function validCheckout() {
  if (!cartLines().length) { toast('Your cart is empty.'); go('shop'); return false; }
  if (!S.checkoutForm.name.trim()) { toast('Please enter your name.'); return false; }
  if (!S.checkoutForm.phone.trim()) { toast('Please enter your phone number.'); return false; }
  const em = S.checkoutForm.email.trim();
  if (!em || !/^\S+@\S+\.\S+$/.test(em)) { toast('Please enter a valid email.'); return false; }
  // Clamp against latest availability (someone may have ordered meanwhile)
  let clamped = false;
  cartLines().forEach(l => {
    const avail = availableStock(l.item);
    if (l.qty>avail) { if(avail>0) S.cart[l.item.id]=avail; else delete S.cart[l.item.id]; clamped=true; }
  });
  if (clamped) { toast('Some quantities were adjusted — stock changed. Please review.'); render(); return false; }
  return true;
}

async function doCheckout() {
  if (!validCheckout()) return;
  if (S.shopMode==='booth') {
    // Booth: create order now (reserves stock) → show payment QR, staff confirms on their device
    S.loading = true; render();
    try {
      const order = await placeOrder('booth');
      S.placedOrderId = order.orderId;
      S.cart = {};
      S.page = 'pay';
    } catch(e) { console.error(e); toast('Error placing order. Try again.'); }
    S.loading = false; render();
  } else {
    S.receiptThumb = null;
    go('pay');
  }
}

async function doPlaceOnline() {
  if (!S.receiptThumb) { toast('Please upload your payment receipt.'); return; }
  if (!validCheckout()) return;
  S.loading = true; render();
  try {
    const order = await placeOrder('online');
    try {
      const url = await uploadOrderPhoto(S.receiptThumb, `receipts/${order.orderId}.jpg`);
      await S.db.collection('orders').doc(order.orderId).set({ receiptUrl:url }, { merge:true });
    } catch(e) { console.warn('receipt upload failed', e); }
    S.placedOrderId = order.orderId;
    S.cart = {}; S.receiptThumb = null;
    S.page = 'order-ok';
  } catch(e) { console.error(e); toast('Error submitting order. Try again.'); }
  S.loading = false; render();
}
